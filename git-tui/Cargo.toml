[package]
name = "git-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Terminal UI for the git-tui commit workflow"

[dependencies]
git-tui-core = { path = "../git-tui-core" }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
similar = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9.6"
unicode-width = "0.1"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-onig"] }

[dev-dependencies]
tempfile = "3"
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
